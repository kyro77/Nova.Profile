<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaProfile</title><style>*{box-sizing:border-box}body{margin:0;background:#08080b;color:#fff;font-family:Inter,system-ui,Arial}.bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:radial-gradient(circle at 50% 10%,#35255c,#08080b 55%)}.card{width:min(570px,95%);padding:30px;text-align:center;background:#0f0f15c2;border:1px solid #ffffff18;border-radius:24px;backdrop-filter:blur(18px);box-shadow:0 25px 100px #000}.avatar{width:96px;height:96px;border-radius:50%;background:#765cf5;margin:auto;border:2px solid #ffffff20}.name{font-size:30px;font-weight:900;margin:12px 0 5px}.bio{color:#aaa;line-height:1.5}.links{display:grid;gap:9px;margin-top:18px}.links a{padding:13px;color:#fff;text-decoration:none;background:#ffffff08;border:1px solid #ffffff0d;border-radius:10px}.meta{font-size:11px;color:#777;margin-top:16px}.top{position:fixed;top:16px;right:16px;display:flex;gap:8px}.btn{padding:9px 12px;border:1px solid #ffffff14;background:#111118dd;color:#fff;border-radius:10px;text-decoration:none;backdrop-filter:blur(10px)}.primary{background:#765cf5;border-color:#765cf5}</style></head><body><div class="top"><a class="btn" href="index.html">NovaProfile</a><a class="btn primary" href="editor.html">Eigenes Profil</a></div><main class="bg"><section class="card"><div class="avatar"></div><div class="name" id="name">yourname</div><div class="bio" id="bio">welcome to my profile ✦</div><div class="links"><a href="#">Discord</a><a href="#">GitHub</a></div><div class="meta" id="meta"></div></section></main><script>const u=new URLSearchParams(location.search).get('u')||'yourname';document.title=u+' — NovaProfile';document.getElementById('name').textContent=u;document.getElementById('meta').textContent='NovaProfile · @'+u;</script></body></html>
